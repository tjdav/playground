[workspace]
resolver = "2"
members = ["relay"]

[workspace.dependencies]
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "ws"] }
tokio = { version = "1.0", features = ["full"] }
futures-util = "0.3"
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
