services:
  pocketbase:
    image: ghcr.io/muchobien/pocketbase:latest
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - pb_data:/pb_data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/api/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  pb_data:
